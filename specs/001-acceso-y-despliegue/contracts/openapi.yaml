openapi: 3.1.0
info:
  title: Mykcal API — 001 acceso y sesión, 002 onboarding, 003 base de alimentos, 004 diario, 005 registro rápido, 006 clave de IA y foto
  version: 0.6.0
  description: >
    Contrato vivo del backend. Las pruebas de contrato validan las respuestas contra este
    fichero. Todas las rutas exigen bearerToken salvo /v1/health y /descargar/mykcal.apk.
servers:
  - url: https://mykcal-bk-api.cruzerick.com
    description: Producción (rama main)
  - url: https://mykcal-bk-dev-api.cruzerick.com
    description: Desarrollo (rama dev)

security:
  - bearerToken: []

paths:
  /v1/health:
    get:
      summary: Estado del servicio y de la base de datos (público)
      security: []
      responses:
        "200":
          description: Servicio y base disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: La base de datos no responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /descargar/mykcal.apk:
    get:
      summary: Descarga del APK de este entorno (público, FR-018)
      security: []
      responses:
        "200":
          description: El APK
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="mykcal.apk"' }
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
        "404":
          description: Todavía no se ha publicado ningún APK

  /v1/me:
    get:
      summary: Identidad del usuario autenticado y estado de su cuenta (FR-011)
      description: >
        Es la única ruta que responde a una cuenta desactivada. Sin cuenta de Mykcal devuelve
        404 ACCOUNT_NOT_REGISTERED y la app muestra la pantalla del código.
      responses:
        "200":
          description: Cuenta existente (activa o desactivada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Identidad válida sin cuenta de Mykcal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/registration:
    post:
      summary: Crear la cuenta de Mykcal con el código de invitación (FR-001, FR-002, FR-013)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_code]
              additionalProperties: false
              properties:
                invitation_code:
                  type: string
                  maxLength: 32
                  description: >
                    Se normaliza (trim, mayúsculas, sin espacios ni guiones). El administrador
                    (ADMIN_SUBJECT) puede enviar una cadena vacía; para cualquier otro usuario, la cadena
                    vacía (o que queda vacía al normalizar) devuelve 400 INVITATION_REQUIRED.
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: >
            INVITATION_INVALID (código erróneo, sustituido o inexistente) o
            INVITATION_REQUIRED (código vacío de un usuario que no es administrador;
            no cuenta como intento)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: NO_SEATS (50 cuentas activas) o ALREADY_REGISTERED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: TOO_MANY_ATTEMPTS; espera creciente activa
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: Segundos que faltan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/admin/invitation:
    get:
      summary: Código vigente y plazas (FR-004, FR-005). Solo administrador
      responses:
        "200":
          description: Estado de las invitaciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/admin/invitation/rotate:
    post:
      summary: Sustituir el código vigente por uno nuevo generado por el servidor (FR-004)
      responses:
        "200":
          description: Nuevo estado; el código anterior deja de valer de inmediato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/consent:
    post:
      summary: Registra el consentimiento de datos de salud (002, FR-001–FR-003)
      description: >
        Idempotente para la misma versión. La hora la pone el servidor. Solo acepta la versión
        vigente del texto (002 research R8). Exige cuenta activa, no consentimiento previo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text_version]
              properties:
                text_version: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "201":
          description: Consentimiento registrado (o ya existía con esa versión)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: CONSENT_VERSION_MISMATCH. La app envía una versión que el servidor no conoce
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/profile:
    get:
      summary: Perfil del usuario y su peso actual (002)
      description: Exige consentimiento (403 CONSENT_REQUIRED sin él).
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: PROFILE_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    put:
      summary: Crea o actualiza el perfil y aplica o propone el recálculo (002, FR-004–FR-006)
      description: >
        La primera vez crea perfil, registro de peso y objetivo calculado en una transacción
        (002 research R11). Después, si cambian los datos del cálculo: recalcula si el objetivo es
        calculated o devuelve una propuesta sin guardarla si es manual (002 research R12).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Perfil guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSaved" }
        "400":
          description: VALIDATION_ERROR con fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/target:
    get:
      summary: Objetivo diario vigente (002)
      responses:
        "200":
          description: Objetivo vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: TARGET_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    put:
      summary: Sobrescribe el objetivo a mano (002, FR-014)
      description: Guarda una versión manual con los 12 valores y copia los datos del cálculo anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetValues" }
      responses:
        "200":
          description: Nueva versión manual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTarget" }
        "400":
          description: VALIDATION_ERROR con fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: PROFILE_REQUIRED. Aún no hay perfil ni objetivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/target/recalculate:
    post:
      summary: Recalcula con el perfil y el peso actuales (002, FR-016)
      responses:
        "200":
          description: Nueva versión calculated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: PROFILE_REQUIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/me/deactivation:
    post:
      summary: Da de baja la cuenta (002, FR-018, FR-019)
      description: >
        Desactiva la cuenta de Mykcal y conserva los datos. No toca el usuario de Zitadel. No exige
        consentimiento. La app cierra la sesión a continuación (002 research R15).
      responses:
        "204": { description: Cuenta desactivada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/search:
    get:
      summary: Busca alimentos por nombre (FR-004, FR-005)
      description: >
        Sin distinguir mayúsculas ni tildes. Devuelve hasta 20 resultados: primero los personalizados
        del usuario, después los genéricos y después los envasados ya consultados (research R6).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodSearchResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/barcode:
    get:
      summary: Busca un producto por código de barras (FR-006–FR-010)
      description: >
        Orden: personalizado propio → copia local (≤ 30 días) → Open Food Facts (research R9).
        El código va en la query para que no quede en el registro de accesos.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9]{8}$|^[0-9]{12,14}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BarcodeLookup" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: >
            FOOD_SOURCE_UNAVAILABLE (Open Food Facts no responde y no hay copia local) o
            AUTH_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /v1/foods/custom:
    get:
      summary: Lista los alimentos personalizados del usuario, por nombre
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomFoodList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      summary: Crea un alimento personalizado (FR-011–FR-014)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFoodInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomFoodSaved" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: FOOD_BARCODE_TAKEN. El usuario ya tiene un alimento con ese código
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/custom/{food_id}:
    parameters:
      - { name: food_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Edita un alimento personalizado propio (no cambia el diario, FR-015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFoodInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomFoodSaved" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FoodNotFound" }
        "409":
          description: FOOD_BARCODE_TAKEN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    delete:
      summary: Elimina un alimento personalizado propio (borrado lógico)
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FoodNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/recent:
    get:
      summary: Últimos 30 alimentos distintos registrados, por último uso (005 FR-001)
      responses:
        "200": { $ref: "#/components/responses/QuickFoodListOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/favorites:
    get:
      summary: Favoritos por último uso; los nunca usados al final por nombre (005 FR-010)
      responses:
        "200": { $ref: "#/components/responses/QuickFoodListOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/favorites/{food_id}:
    parameters:
      - { name: food_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Marca un alimento como favorito (idempotente, 005 FR-003)
      responses:
        "204": { description: Es favorito }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FoodNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    delete:
      summary: Desmarca un favorito (idempotente, 005 US2.3)
      responses:
        "204": { description: No es favorito }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/foods/{food_id}:
    get:
      summary: Detalle de un alimento visible para el usuario
      parameters:
        - { name: food_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FoodNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/days/{date}:
    get:
      summary: Día del diario con resumen y comidas (FR-006–FR-012)
      parameters:
        - { $ref: "#/components/parameters/DiaryDate" }
        - { $ref: "#/components/parameters/UtcOffsetMin" }
      responses:
        "200": { $ref: "#/components/responses/DiaryDayOk" }
        "400": { $ref: "#/components/responses/DiaryBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TargetNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/entries:
    post:
      summary: Añade un alimento a una comida (FR-002–FR-004)
      description: >
        Copia el nombre y los valores por 100 del alimento (research R5). Lleva `quantity` o
        `servings`, nunca los dos. Responde con el día completo de `date`.
      parameters:
        - { $ref: "#/components/parameters/UtcOffsetMin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryEntryCreate" }
      responses:
        "201":
          description: Día completo y recalculado
          headers:
            Location:
              description: /v1/diary/entries/{id} de la entrada creada (005 R3)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryDay" }
        "400": { $ref: "#/components/responses/DiaryBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Alimento no disponible para el usuario o sin objetivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/entries/{entry_id}:
    patch:
      summary: Cambia la cantidad o la comida de una entrada (FR-005)
      description: >
        Solo dentro del mismo día. Los valores se recalculan con la copia guardada, no con el
        alimento actual (FR-004). Enviar `quantity` pone `servings` a null.
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/UtcOffsetMin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryEntryUpdate" }
      responses:
        "200": { $ref: "#/components/responses/DiaryDayOk" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EntryNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    delete:
      summary: Borra una entrada; se puede deshacer (FR-005, research R8)
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/UtcOffsetMin" }
      responses:
        "200": { $ref: "#/components/responses/DiaryDayOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EntryNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/entries/{entry_id}/restore:
    post:
      summary: Deshace el borrado (hasta 60 s después)
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/UtcOffsetMin" }
      responses:
        "200": { $ref: "#/components/responses/DiaryDayOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EntryNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/copy-sources:
    get:
      summary: Comidas con entradas de los 14 días anteriores al destino (005 FR-005)
      parameters:
        - { name: target_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: target_meal, in: query, required: true, schema: { $ref: "#/components/schemas/Meal" } }
      responses:
        "200":
          description: Días del más reciente al más antiguo; solo días y comidas con entradas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopySourceList" }
        "400": { $ref: "#/components/responses/DiaryBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/copies:
    post:
      summary: Copia todas las entradas de una comida a una comida del día destino (005 FR-005, FR-006)
      parameters:
        - { $ref: "#/components/parameters/UtcOffsetMin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryCopyCreate" }
      responses:
        "201":
          description: Copia hecha; día destino completo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryCopyResult" }
        "400":
          description: VALIDATION_ERROR, DIARY_DATE_OUT_OF_RANGE o COPY_SOURCE_EMPTY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TargetNotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/diary/copies/{copy_id}:
    parameters:
      - { name: copy_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: "#/components/parameters/UtcOffsetMin" }
    delete:
      summary: Deshace una copia hecha hace 60 s o menos; borra solo sus entradas (005 FR-007)
      responses:
        "200": { $ref: "#/components/responses/DiaryDayOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: COPY_NOT_FOUND (inexistente, ajena, ya deshecha o fuera de plazo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/ai-key:
    get:
      summary: Estado de la clave de IA del usuario (006 FR-003)
      responses:
        "200":
          description: Tiene clave configurada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiKeyStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: AI_KEY_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    put:
      summary: Guarda o sustituye la clave tras comprobarla con el proveedor (006 FR-001, FR-002)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiKeyCreate" }
      responses:
        "200":
          description: Clave guardada (cifrada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiKeyStatus" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: AI_KEY_INVALID. El proveedor rechaza la clave; no se guarda nada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: AI_PROVIDER_UNAVAILABLE (no se puede comprobar) o AUTH_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
    delete:
      summary: Quita la clave (idempotente, 006 FR-003)
      responses:
        "204": { description: Sin clave }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/photo-analysis:
    post:
      summary: Analiza la foto de un plato con la clave del usuario; la foto no se guarda (006 FR-006, FR-012)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, meal, entry_date]
              properties:
                photo: { type: string, format: binary, description: JPEG de 4 MB como máximo }
                meal: { $ref: "#/components/schemas/Meal" }
                entry_date: { type: string, format: date }
                description: { type: string, maxLength: 500 }
                total_grams: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Propuesta de alimentos emparejados con la base
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoAnalysisResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: AI_KEY_REQUIRED (sin clave), CONSENT_REQUIRED o cuenta no activa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "413":
          description: Foto de más de 4 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "422":
          description: AI_KEY_INVALID, AI_RESPONSE_INVALID o AI_UNRECOGNIZED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: AI_QUOTA_EXCEEDED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: AI_PROVIDER_UNAVAILABLE o AUTH_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "504":
          description: AI_TIMEOUT (más de 55 s)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT de https://mg-zitadel.cruzerick.com con aud = ID del proyecto mykcal.
        Validado contra el JWKS (research R4).

  parameters:
    DiaryDate:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    EntryId:
      name: entry_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UtcOffsetMin:
      name: utc_offset_min
      in: query
      required: true
      schema: { type: integer, minimum: -840, maximum: 840 }

  responses:
    Unauthorized:
      description: UNAUTHORIZED. Sin token, o token inválido, caducado o de otra audiencia
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer error="invalid_token"' }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: ACCOUNT_NOT_REGISTERED, ACCOUNT_DISABLED o FORBIDDEN (no es administrador)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    AuthUnavailable:
      description: AUTH_UNAVAILABLE. No hay JWKS en memoria y Zitadel no responde
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

    ValidationError:
      description: VALIDATION_ERROR, con los nombres de los campos en `fields` (nueva; la 002 lo declaraba en línea)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FoodNotFound:
      description: >
        FOOD_NOT_FOUND. No existe, está eliminado o es un personalizado de otro usuario (las tres
        situaciones responden igual)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

    DiaryDayOk:
      description: Día completo y recalculado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DiaryDay" }
    DiaryBadRequest:
      description: "`VALIDATION_ERROR` o `DIARY_DATE_OUT_OF_RANGE`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    EntryNotFound:
      description: "`ENTRY_NOT_FOUND`: no existe, es de otro usuario o venció el plazo de deshacer"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    QuickFoodListOk:
      description: Alimentos listos para añadir con un toque
      content:
        application/json:
          schema: { $ref: "#/components/schemas/QuickFoodList" }
    TargetNotFound:
      description: "`TARGET_NOT_FOUND`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [id, display_name, is_admin, status, onboarding, registered_at]
      properties:
        onboarding:
          type: string
          enum: [consent, profile, done]
          description: Paso pendiente del onboarding (002 research R10)
        id: { type: string, format: uuid, description: Identificador interno de Mykcal }
        display_name: { type: string }
        is_admin: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        registered_at: { type: string, format: date-time, description: Alta de la cuenta; primer día navegable del diario (004 R2) }

    InvitationStatus:
      type: object
      additionalProperties: false
      required: [code, created_at, active_accounts, max_accounts, free_seats]
      properties:
        code:
          type: [string, "null"]
          description: Código vigente sin guion (la app lo muestra como ABCD-EFGH); null si no hay
        created_at: { type: [string, "null"], format: date-time }
        active_accounts: { type: integer, minimum: 0, maximum: 50 }
        max_accounts: { type: integer, const: 50 }
        free_seats: { type: integer, minimum: 0, maximum: 50 }

    Consent:
      type: object
      additionalProperties: false
      required: [text_version, accepted_at]
      properties:
        text_version: { type: string }
        accepted_at: { type: string, format: date-time }

    ProfileInput:
      type: object
      additionalProperties: false
      required: [age, sex, height_cm, weight_kg, activity_level, goal, measured_on]
      properties:
        age: { type: integer, minimum: 18, maximum: 100 }
        sex: { type: string, enum: [male, female] }
        height_cm: { type: integer, minimum: 100, maximum: 250 }
        weight_kg:
          type: number
          minimum: 30
          maximum: 300
          description: Con un decimal como máximo; el servidor valida con Decimal (002 research R14)
        activity_level: { type: string, enum: [sedentary, light, moderate, high, very_high] }
        goal: { type: string, enum: [lose_fat, maintain, gain_muscle] }
        measured_on:
          type: string
          format: date
          description: Fecha local del móvil para el registro de peso (002 research R6)

    Profile:
      type: object
      additionalProperties: false
      required: [age, sex, height_cm, weight_kg, weight_measured_on, activity_level, goal, updated_at]
      properties:
        age: { type: integer }
        sex: { type: string, enum: [male, female] }
        height_cm: { type: integer }
        weight_kg: { type: number, description: Peso del registro más reciente }
        weight_measured_on: { type: string, format: date }
        activity_level: { type: string, enum: [sedentary, light, moderate, high, very_high] }
        goal: { type: string, enum: [lose_fat, maintain, gain_muscle] }
        updated_at: { type: string, format: date-time }

    TargetValues:
      type: object
      additionalProperties: false
      required: [kcal, protein_g, carbs_g, fat_g, fiber_g, sodium_mg, potassium_mg, calcium_mg, iron_mg, magnesium_mg, vitamin_d_ug, vitamin_c_mg]
      properties:
        kcal: { type: integer, minimum: 1, maximum: 10000 }
        protein_g: { type: integer, minimum: 0, maximum: 1000 }
        carbs_g: { type: integer, minimum: 0, maximum: 2000 }
        fat_g: { type: integer, minimum: 0, maximum: 1000 }
        fiber_g: { type: integer, minimum: 0, maximum: 200 }
        sodium_mg: { type: integer, minimum: 0, maximum: 20000 }
        potassium_mg: { type: integer, minimum: 0, maximum: 20000 }
        calcium_mg: { type: integer, minimum: 0, maximum: 10000 }
        iron_mg: { type: integer, minimum: 0, maximum: 200 }
        magnesium_mg: { type: integer, minimum: 0, maximum: 5000 }
        vitamin_d_ug: { type: integer, minimum: 0, maximum: 500 }
        vitamin_c_mg: { type: integer, minimum: 0, maximum: 5000 }

    DailyTarget:
      type: object
      additionalProperties: false
      required: [values, source, effective_from, calculation]
      properties:
        values: { $ref: "#/components/schemas/TargetValues" }
        source: { type: string, enum: [calculated, manual] }
        effective_from: { type: string, format: date-time }
        calculation:
          type: object
          additionalProperties: false
          required: [weight_kg, age, sex, height_cm, activity_level, goal, calculated_at, notices]
          description: Datos usados en el último cálculo (002 FR-013)
          properties:
            weight_kg: { type: number }
            age: { type: integer }
            sex: { type: string, enum: [male, female] }
            height_cm: { type: integer }
            activity_level: { type: string, enum: [sedentary, light, moderate, high, very_high] }
            goal: { type: string, enum: [lose_fat, maintain, gain_muscle] }
            calculated_at: { type: string, format: date-time }
            notices:
              type: array
              items: { type: string, enum: [MIN_KCAL_APPLIED, CARBS_CLAMPED] }

    ProfileSaved:
      type: object
      additionalProperties: false
      required: [profile, target, recalculation]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        target: { $ref: "#/components/schemas/DailyTarget" }
        recalculation:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [created, applied, proposed, none]
              description: >
                created = primer objetivo; applied = recalculado automáticamente;
                proposed = objetivo manual, ver proposed (no guardado); none = sin cambios
            previous:
              description: Solo con applied; valores anteriores para mostrar el cambio
              $ref: "#/components/schemas/TargetValues"
            proposed:
              description: Solo con proposed; no se ha guardado
              $ref: "#/components/schemas/TargetValues"

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - AUTH_UNAVAILABLE
            - ACCOUNT_NOT_REGISTERED
            - ACCOUNT_DISABLED
            - FORBIDDEN
            - ALREADY_REGISTERED
            - INVITATION_INVALID
            - INVITATION_REQUIRED
            - CONSENT_REQUIRED
            - CONSENT_VERSION_MISMATCH
            - PROFILE_NOT_FOUND
            - PROFILE_REQUIRED
            - TARGET_NOT_FOUND
            - FOOD_NOT_FOUND
            - FOOD_BARCODE_TAKEN
            - FOOD_SOURCE_UNAVAILABLE
            - DIARY_DATE_OUT_OF_RANGE
            - ENTRY_NOT_FOUND
            - COPY_SOURCE_EMPTY
            - COPY_NOT_FOUND
            - AI_KEY_NOT_FOUND
            - AI_KEY_INVALID
            - AI_KEY_REQUIRED
            - AI_PROVIDER_UNAVAILABLE
            - AI_QUOTA_EXCEEDED
            - AI_RESPONSE_INVALID
            - AI_UNRECOGNIZED
            - AI_TIMEOUT
            - NO_SEATS
            - TOO_MANY_ATTEMPTS
            - VALIDATION_ERROR
            - INTERNAL_ERROR
        message:
          type: string
          description: Texto técnico estable en español; la app muestra su propio texto según code
        retry_after_s: { type: integer, minimum: 1 }
        fields:
          type: array
          items: { type: string }
          description: Solo con VALIDATION_ERROR; nombres de campo, nunca valores (002 research R14)

    Nutrients:
      type: object
      description: Valores por 100 g o 100 ml según base_unit. null = sin dato (FR-003)
      additionalProperties: false
      required: [kcal, protein_g, carbs_g, fat_g, fiber_g, sodium_mg, potassium_mg, calcium_mg,
                 iron_mg, magnesium_mg, vitamin_d_ug, vitamin_c_mg]
      properties:
        kcal: { type: number, minimum: 0, maximum: 900 }
        protein_g: { type: number, minimum: 0, maximum: 100 }
        carbs_g: { type: number, minimum: 0, maximum: 100 }
        fat_g: { type: number, minimum: 0, maximum: 100 }
        fiber_g: { type: [number, "null"], minimum: 0, maximum: 100 }
        sodium_mg: { type: [number, "null"], minimum: 0, maximum: 40000 }
        potassium_mg: { type: [number, "null"], minimum: 0, maximum: 10000 }
        calcium_mg: { type: [number, "null"], minimum: 0, maximum: 5000 }
        iron_mg: { type: [number, "null"], minimum: 0, maximum: 500 }
        magnesium_mg: { type: [number, "null"], minimum: 0, maximum: 2000 }
        vitamin_d_ug: { type: [number, "null"], minimum: 0, maximum: 1000 }
        vitamin_c_mg: { type: [number, "null"], minimum: 0, maximum: 5000 }

    FoodSummary:
      type: object
      additionalProperties: false
      required: [id, kind, name, brand, base_unit, kcal, is_mine]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [generic, packaged, custom] }
        name: { type: string }
        brand: { type: [string, "null"] }
        base_unit: { type: string, enum: [g, ml] }
        kcal: { type: number, description: kcal por 100 g/ml }
        is_mine: { type: boolean, description: true solo en los personalizados (US3.3) }

    FoodSearchResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/FoodSummary" }

    Food:
      type: object
      additionalProperties: false
      required: [id, kind, name, brand, barcode, base_unit, per_100, serving_size, is_mine, source,
                 updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [generic, packaged, custom] }
        name: { type: string }
        brand: { type: [string, "null"] }
        barcode: { type: [string, "null"] }
        base_unit: { type: string, enum: [g, ml] }
        per_100: { $ref: "#/components/schemas/Nutrients" }
        serving_size: { type: [number, "null"], description: Ración en base_unit (FR-010) }
        is_mine: { type: boolean }
        source: { type: string, enum: [ciqual, "off", user] }
        updated_at: { type: string, format: date-time }

    BarcodeLookup:
      type: object
      additionalProperties: false
      required: [result, code]
      properties:
        result:
          type: string
          enum: [found, not_found, incomplete]
          description: >
            found: hay alimento utilizable. not_found: OFF no lo conoce (US2.3). incomplete: OFF lo
            conoce pero le faltan kcal o macros (US2.4). En los dos últimos la app ofrece crear
            un personalizado con el código.
        code: { type: string, description: Código normalizado (UPC-A → EAN-13) }
        food: { $ref: "#/components/schemas/Food", description: Solo con found }
        stale:
          type: boolean
          description: Solo con found; true si la copia local tiene más de 30 días y OFF no respondió
        product_name: { type: [string, "null"], description: Solo con incomplete, para precargar el formulario }
        brand: { type: [string, "null"], description: Solo con incomplete }

    CustomFoodInput:
      type: object
      additionalProperties: false
      required: [name, base_unit, basis, values]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        brand: { type: [string, "null"], maxLength: 80 }
        barcode: { type: [string, "null"], pattern: "^[0-9]{8}$|^[0-9]{12,14}$" }
        base_unit: { type: string, enum: [g, ml] }
        basis:
          type: string
          enum: [per_100, per_serving]
          description: Cómo vienen los valores. Con per_serving, serving_size es obligatorio (FR-013)
        serving_size: { type: [number, "null"], exclusiveMinimum: 0, maximum: 5000 }
        values:
          type: object
          additionalProperties: false
          required: [kcal, protein_g, carbs_g, fat_g]
          description: Valores por 100 o por ración según basis. Los opcionales ausentes o null = sin dato
          properties:
            kcal: { type: number, minimum: 0 }
            protein_g: { type: number, minimum: 0 }
            carbs_g: { type: number, minimum: 0 }
            fat_g: { type: number, minimum: 0 }
            fiber_g: { type: [number, "null"], minimum: 0 }
            sodium_mg: { type: [number, "null"], minimum: 0 }
            potassium_mg: { type: [number, "null"], minimum: 0 }
            calcium_mg: { type: [number, "null"], minimum: 0 }
            iron_mg: { type: [number, "null"], minimum: 0 }
            magnesium_mg: { type: [number, "null"], minimum: 0 }
            vitamin_d_ug: { type: [number, "null"], minimum: 0 }
            vitamin_c_mg: { type: [number, "null"], minimum: 0 }

    CustomFoodSaved:
      type: object
      additionalProperties: false
      required: [food, warnings]
      properties:
        food: { $ref: "#/components/schemas/Food" }
        warnings:
          type: array
          items: { type: string, enum: [KCAL_MISMATCH] }

    CustomFoodList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FoodSummary" }

    Meal:
      type: string
      enum: [breakfast, lunch, afternoon_snack, dinner, snacks]

    DiaryEntryCreate:
      type: object
      additionalProperties: false
      required: [date, meal, food_id]
      properties:
        date: { type: string, format: date }
        meal: { $ref: "#/components/schemas/Meal" }
        food_id: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 10000, multipleOf: 0.1 }
        servings: { type: number, exclusiveMinimum: 0, maximum: 100, multipleOf: 0.01 }
      oneOf:
        - required: [quantity]
        - required: [servings]

    DiaryEntryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        meal: { $ref: "#/components/schemas/Meal" }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 10000, multipleOf: 0.1 }
        servings: { type: number, exclusiveMinimum: 0, maximum: 100, multipleOf: 0.01 }
      not:
        required: [quantity, servings]

    DiaryEntry:
      type: object
      additionalProperties: false
      required: [id, meal, food_id, food_kind, food_name, food_brand, base_unit, serving_size,
                 per_100, quantity, servings, values, incomplete, created_at]
      properties:
        id: { type: string, format: uuid }
        meal: { $ref: "#/components/schemas/Meal" }
        food_id: { type: string, format: uuid }
        food_kind: { type: string, enum: [generic, packaged, custom] }
        food_name: { type: string }
        food_brand: { type: [string, "null"] }
        base_unit: { type: string, enum: [g, ml] }
        serving_size: { type: [number, "null"] }
        per_100:
          $ref: "#/components/schemas/Nutrients"
          description: Copia por 100 guardada al registrar; la app la usa para la vista previa al editar
        quantity: { type: number }
        servings: { type: [number, "null"] }
        values:
          $ref: "#/components/schemas/NutrientAmounts"
          description: Valores de la entrada (no por 100), redondeados para mostrar (research R10)
        incomplete:
          type: array
          items: { type: string }
          description: Nutrientes sin dato en esta entrada
        created_at: { type: string, format: date-time }

    NutrientAmounts:
      type: object
      description: >
        Cantidades de una entrada o de un total (no por 100), sin los máximos por 100 de
        `Nutrients`. En un total ninguno es null; en una entrada, un opcional es null si la copia
        no tenía el dato.
      additionalProperties: false
      required: [kcal, protein_g, carbs_g, fat_g, fiber_g, sodium_mg, potassium_mg, calcium_mg,
                 iron_mg, magnesium_mg, vitamin_d_ug, vitamin_c_mg]
      properties:
        kcal: { type: number, minimum: 0 }
        protein_g: { type: number, minimum: 0 }
        carbs_g: { type: number, minimum: 0 }
        fat_g: { type: number, minimum: 0 }
        fiber_g: { type: [number, "null"], minimum: 0 }
        sodium_mg: { type: [number, "null"], minimum: 0 }
        potassium_mg: { type: [number, "null"], minimum: 0 }
        calcium_mg: { type: [number, "null"], minimum: 0 }
        iron_mg: { type: [number, "null"], minimum: 0 }
        magnesium_mg: { type: [number, "null"], minimum: 0 }
        vitamin_d_ug: { type: [number, "null"], minimum: 0 }
        vitamin_c_mg: { type: [number, "null"], minimum: 0 }

    NutrientTotals:
      type: object
      additionalProperties: false
      required: [consumed, incomplete]
      properties:
        consumed: { $ref: "#/components/schemas/NutrientAmounts" }
        incomplete:
          type: array
          items: { type: string }
          description: Nutrientes con alguna entrada sin dato (FR-008)

    DiaryMeal:
      type: object
      additionalProperties: false
      required: [meal, entries, totals]
      properties:
        meal: { $ref: "#/components/schemas/Meal" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DiaryEntry" }
          description: En orden de creación
        totals: { $ref: "#/components/schemas/NutrientTotals" }

    DiaryDay:
      type: object
      additionalProperties: false
      required: [date, target, totals, remaining, meals]
      properties:
        date: { type: string, format: date }
        target:
          $ref: "#/components/schemas/TargetValues"
          description: Objetivo vigente al final de ese día (FR-011, research R3)
        totals: { $ref: "#/components/schemas/NutrientTotals" }
        remaining:
          type: object
          description: >
            objetivo − consumido, con los 12 nutrientes. Negativo = exceso. En el sodio, lo que
            queda hasta el máximo.
          additionalProperties: { type: number }
        meals:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/DiaryMeal" }
          description: Siempre las 5, en orden fijo (FR-001)

    QuickFood:
      type: object
      required: [food, suggested_quantity, suggested_servings, last_used_at, is_favorite]
      properties:
        food: { $ref: "#/components/schemas/Food" }
        suggested_quantity: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        suggested_servings: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        last_used_at: { type: [string, "null"], format: date-time }
        is_favorite: { type: boolean }

    QuickFoodList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QuickFood" } }

    CopySourceEntry:
      type: object
      required: [food_name, food_brand, base_unit, quantity, servings, kcal]
      properties:
        food_name: { type: string }
        food_brand: { type: [string, "null"] }
        base_unit: { type: string, enum: [g, ml] }
        quantity: { type: number }
        servings: { type: [number, "null"] }
        kcal: { type: number, description: "Redondeado a entero, de la copia de la entrada" }

    CopySourceMeal:
      type: object
      required: [meal, entries, kcal, values_changed]
      properties:
        meal: { $ref: "#/components/schemas/Meal" }
        entries: { type: array, minItems: 1, items: { $ref: "#/components/schemas/CopySourceEntry" } }
        kcal: { type: number }
        values_changed:
          type: boolean
          description: Algún alimento disponible tiene hoy otros valores que la entrada (005 R7)

    CopySourceDay:
      type: object
      required: [date, meals]
      properties:
        date: { type: string, format: date }
        meals:
          type: array
          minItems: 1
          maxItems: 5
          description: Primero la del mismo tipo que target_meal; luego en el orden fijo
          items: { $ref: "#/components/schemas/CopySourceMeal" }

    CopySourceList:
      type: object
      required: [days]
      properties:
        days: { type: array, maxItems: 14, items: { $ref: "#/components/schemas/CopySourceDay" } }

    DiaryCopyCreate:
      type: object
      additionalProperties: false
      required: [source_date, source_meal, target_date, target_meal]
      properties:
        source_date: { type: string, format: date }
        source_meal: { $ref: "#/components/schemas/Meal" }
        target_date: { type: string, format: date }
        target_meal: { $ref: "#/components/schemas/Meal" }

    DiaryCopyResult:
      type: object
      required: [copy_id, entry_ids, day]
      properties:
        copy_id: { type: string, format: uuid }
        entry_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
        day: { $ref: "#/components/schemas/DiaryDay" }

    AiKeyStatus:
      type: object
      additionalProperties: false
      required: [has_key, provider, configured_at]
      properties:
        has_key: { type: boolean, const: true }
        provider: { type: string, enum: [gemini] }
        configured_at: { type: string, format: date-time }

    AiKeyCreate:
      type: object
      additionalProperties: false
      required: [raw_key]
      properties:
        raw_key: { type: string, minLength: 1, maxLength: 256 }

    ProposedItem:
      type: object
      required: [ai_name, ai_grams, flagged]
      properties:
        ai_name: { type: string }
        ai_grams: { type: number }
        flagged: { type: boolean }
        matched_food:
          anyOf:
            - { $ref: "#/components/schemas/FoodSummary" }
            - { type: "null" }
        matched_similarity: { type: [number, "null"] }
        kcal: { type: [number, "null"] }
        protein_g: { type: [number, "null"] }
        carbs_g: { type: [number, "null"] }
        fat_g: { type: [number, "null"] }

    PhotoAnalysisResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProposedItem" }
